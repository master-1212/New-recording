name: Security and quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Use the reviewed Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.0
          package-manager-cache: false

      - name: Activate the pinned package manager
        run: corepack enable && corepack prepare pnpm@11.16.0 --activate

      - name: Install exactly the reviewed lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch and verify hash-pinned runtime binaries
        run: pnpm vendor:runtime

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: DSP diagnostics
        run: pnpm test

      - name: Reject high-severity dependency advisories
        run: pnpm security:audit

      - name: Production build
        run: pnpm build
